[platformio]
default_envs = xiao_esp32s3

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.3.6
    adafruit/Adafruit DRV2605 Library@1.2.4
    pololu/VL53L1X@1.3.1
    sparkfun/SparkFun VL53L5CX Arduino Library@1.0.3
build_flags = -I../shared

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DBELT_SDA=5 -DBELT_SCL=6 -DDROP_A_RX=44 -DDROP_A_TX=43 -DDROP_B_RX=1 -DDROP_B_TX=2 -DSONAR_PWM=3

[env:esp32s3_devkit]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DBELT_SDA=8 -DBELT_SCL=9 -DDROP_A_RX=18 -DDROP_A_TX=17 -DDROP_B_RX=16 -DDROP_B_TX=15 -DSONAR_PWM=4
