name: Native Apple SDK checks

on:
  push:
    branches: [master, codex/recovery-hazard-order-20261027]
    paths:
      - 'BlindCore/**'
      - 'BlindMemory/**'
      - 'ios/**'
      - 'tools/ci/**'
      - 'research/native-mesh-decoder-81/**'
      - 'research/arkit-mesh-adapter-82/**'
      - 'research/live-mesh-classified-bench-20261028/**'
      - 'research/mesh-candidate-ingress-83/**'
      - 'research/room-mesh-package-75/**'
      - 'research/native-candidate-app-integration-85/integrated/check.py'
      - 'research/native-candidate-app-integration-85/integrated/SOURCE_PINS.json'
      - '.github/workflows/native-apple.yml'
  workflow_dispatch:

permissions:
  contents: read

# No paid-storage assumption: uploads require a separately reviewed source opt-in.
# Normal push/dispatch runs retain evidence only in built-in logs and job summaries.
env:
  BLIND_UPLOAD_ARTIFACTS: 'false'

concurrency:
  group: native-apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    # Fail closed before allocating a runner if visibility changes or this is a fork.
    if: github.repository == 'mischa23v/blind' && github.event.repository.private == false && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/recovery-hazard-order-20261027')
    runs-on: xcode-27
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Verify source and installed Apple toolchain
        id: preflight
        timeout-minutes: 3
        run: bash tools/ci/native-apple.sh preflight
      - name: BlindCore package tests on macOS
        id: core
        timeout-minutes: 18
        run: bash tools/ci/native-apple.sh core
      - name: BlindMemory package tests on macOS
        id: memory
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        timeout-minutes: 12
        run: bash tools/ci/native-apple.sh memory
      - name: Unsigned default iOS Simulator build
        id: build
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        timeout-minutes: 20
        run: bash tools/ci/native-apple.sh build
      - name: Hosted iOS unit tests
        id: unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: bash tools/ci/native-apple.sh unit
      - name: Extract bounded hosted-unit case statuses before UI tests
        if: always()
        timeout-minutes: 3
        run: |
          out="$RUNNER_TEMP/blind-native-ci"
          if [[ -d "$out/unit.xcresult" ]]; then
            if python3 tools/ci/export-native-unit-statuses.py --summary "$out/unit.xcresult" "$out/unit-summary.json"; then
              :
            else
              echo "unit xcresult summary unavailable; consult bounded test output above."
            fi
          fi
          python3 tools/ci/export-native-unit-statuses.py "$out/unit.xcresult" "$out/unit.log" "$out/unit-case-statuses.json" || true
          python3 tools/ci/export-public-apple-same-export.py "$out/unit.xcresult" "$out/unit-case-statuses.json" "$out/public-apple-same-export" || true
      - name: Preserve bounded hosted-unit case statuses
        if: always() && env.BLIND_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-unit-case-statuses-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blind-native-ci/unit-case-statuses.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve bounded public Apple same-export comparison assets
        if: always() && env.BLIND_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-apple-same-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/blind-native-ci/public-apple-same-export/APPLE_ROOM_ROUTE_Hallway2_SAME_EXPORT.usdz
            ${{ runner.temp }}/blind-native-ci/public-apple-same-export/APPLE_ROOM_ROUTE_Hallway2_SAME_EXPORT_METADATA.bin
            ${{ runner.temp }}/blind-native-ci/public-apple-same-export/APPLE_ROOM_ROUTE_Bedroom3_SAME_EXPORT.usdz
            ${{ runner.temp }}/blind-native-ci/public-apple-same-export/APPLE_ROOM_ROUTE_Bedroom3_SAME_EXPORT_METADATA.bin
            ${{ runner.temp }}/blind-native-ci/public-apple-same-export/APPLE_ROOM_ROUTE_MESH_METADATA_INVENTORY.json
            ${{ runner.temp }}/blind-native-ci/public-apple-same-export/APPLE_ROOM_ROUTE_SAME_EXPORT_MANIFEST.json
            ${{ runner.temp }}/blind-native-ci/public-apple-same-export/receipt.json
          if-no-files-found: error
          retention-days: 3
      - name: Run exact optional seed-radius policy and existing strict controls
        id: seed-radius
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: bash tools/ci/native-apple.sh seed-radius-unit
      - name: Export bounded focused identities and assertion failures before strict validation
        if: always()
        timeout-minutes: 3
        run: python3 tools/ci/export-seed-radius-diagnostics.py "$RUNNER_TEMP/blind-native-ci"
      - name: Verify exact fourteen seed-radius hosted cases and source identity
        if: always()
        timeout-minutes: 3
        run: python3 tools/ci/collect-seed-radius.py "$RUNNER_TEMP/blind-native-ci"
      - name: Preserve bounded optional-policy hosted receipt
        if: always() && env.BLIND_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seed-radius-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/blind-native-ci/seed-radius-results.json
            ${{ runner.temp }}/blind-native-ci/seed-radius-unit-exit.json
            ${{ runner.temp }}/blind-native-ci/seed-radius-diagnostics.json
          if-no-files-found: error
          retention-days: 3

      - name: iOS UI and accessibility audit tests
        id: ui
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: bash tools/ci/native-apple.sh ui
      - name: Extract callback evidence from the existing UI result bundle
        if: always()
        timeout-minutes: 3
        run: python3 tools/ci/export-full-audit-evidence.py "$RUNNER_TEMP/blind-native-ci/ui.xcresult" "$RUNNER_TEMP/blind-main-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve bounded synthetic main UI audit evidence
        if: always() && env.BLIND_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-ui-audit-callback-evidence
          path: |
            ${{ runner.temp }}/blind-main-audit-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/*.png
            ${{ runner.temp }}/blind-main-audit-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/*.json
          if-no-files-found: error
          retention-days: 3
      - name: Inspect exact synthetic UI test device identities
        if: always() && steps.preflight.outcome == 'success'
        timeout-minutes: 2
        run: python3 tools/ci/export-ui-test-device-evidence.py "$RUNNER_TEMP/blind-native-ci/ui.xcresult" "$RUNNER_TEMP/blind-native-ci/simulator-id" "$RUNNER_TEMP/blind-ui-devices-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve bounded synthetic UI device identity evidence
        if: always() && steps.preflight.outcome == 'success' && env.BLIND_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-test-device-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/blind-ui-devices-${{ github.run_id }}-${{ github.run_attempt }}/ui-test-device-evidence.json
            ${{ runner.temp }}/blind-ui-devices-${{ github.run_id }}-${{ github.run_attempt }}/xcresult-test-details-help.txt
            ${{ runner.temp }}/blind-ui-devices-${{ github.run_id }}-${{ github.run_attempt }}/xcresult-test-details-schema.json
          if-no-files-found: error
          retention-days: 3
      - name: Extract bounded synthetic Practice runtime evidence
        if: always() && steps.preflight.outcome == 'success'
        timeout-minutes: 2
        run: python3 tools/ci/export-practice-runtime-evidence.py "$RUNNER_TEMP/blind-native-ci/simulator-id" "$RUNNER_TEMP/blind-native-ci/ui.log" "$RUNNER_TEMP/blind-practice-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve bounded synthetic Practice runtime evidence
        if: always() && steps.preflight.outcome == 'success' && env.BLIND_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: practice-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blind-practice-runtime-${{ github.run_id }}-${{ github.run_attempt }}/practice-runtime-evidence.json
          if-no-files-found: error
          retention-days: 3
      - name: Summarize native evidence and preserve source
        if: always() && steps.preflight.outcome == 'success'
        timeout-minutes: 3
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
          MEMORY_OUTCOME: ${{ steps.memory.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
        run: bash tools/ci/native-apple.sh summary
      - name: Emit bounded log-only CI receipts
        if: always()
        timeout-minutes: 1
        env:
          CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: python3 -B tools/ci/emit-ci-log-receipts.py native

  mesh-diagnostics-compile:
    # Separate runner/derived data: cannot change the default app test configuration.
    if: github.repository == 'mischa23v/blind' && github.event.repository.private == false && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/recovery-hazard-order-20261027')
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Verify integrated no-copy source and toolchain
        id: preflight
        timeout-minutes: 3
        run: |
          python3 research/native-candidate-app-integration-85/integrated/check.py
          bash tools/ci/native-apple.sh preflight
      - name: Compile diagnostics flag present only
        id: build
        timeout-minutes: 20
        run: bash tools/ci/native-apple.sh diagnostics-build
      - name: Run exact flag-only seated projection and ownership fixtures
        id: unit
        timeout-minutes: 10
        run: bash tools/ci/native-apple.sh diagnostics-unit
      - name: Verify exact twelve synthetic hosted cases and source identity
        id: collect
        if: always()
        timeout-minutes: 3
        run: python3 tools/ci/collect-seated-projection.py "$RUNNER_TEMP/blind-native-ci"
      - name: Preserve bounded flag-only synthetic fixture receipt
        if: always() && env.BLIND_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seated-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/blind-native-ci/seated-projection-results.json
            ${{ runner.temp }}/blind-native-ci/diagnostics-unit-exit.json
          if-no-files-found: error
          retention-days: 3
      - name: Emit bounded log-only CI receipts
        if: always()
        timeout-minutes: 1
        env:
          CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: python3 -B tools/ci/emit-ci-log-receipts.py mesh-diagnostics-compile

  classified-mesh-bench:
    # Synthetic owned buffers only; macOS excludes the five iOS session fixtures.
    if: github.repository == 'mischa23v/blind' && github.event.repository.private == false && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/recovery-hazard-order-20261027')
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Verify source and installed Apple toolchain
        id: preflight
        timeout-minutes: 3
        run: |
          bash tools/ci/native-apple.sh preflight
          out="$RUNNER_TEMP/classified-mesh-bench"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-sha.txt"
          git status --porcelain > "$out/source-before.txt"
          xcrun swift --version > "$out/swift-version.txt"
          xcrun swift test --help > "$out/swift-test-help.txt"
          grep -q -- '--build-system' "$out/swift-test-help.txt"
          grep -q -- '--xunit-output' "$out/swift-test-help.txt"
      - name: Run isolated classified-mesh package fixtures on macOS
        id: fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/classified-mesh-bench"
          mkdir -p "$out"
          set +e
          xcrun swift test --package-path research/live-mesh-classified-bench-20261028 --scratch-path "$RUNNER_TEMP/classified-mesh-bench-build" --build-system native --jobs 1 --xunit-output "$out/tests.xml" 2> "$out/swift-test.stderr.log" | tee "$out/swift-test.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '{"swift_test_exit_code":%s,"log_writer_exit_code":%s,"scope":"macOS synthetic dependency fixtures","ios_session_fixtures_excluded":5}\n' "${statuses[0]}" "${statuses[1]}" > "$out/result.json"
          git status --porcelain > "$out/source-after.txt"
          cat "$out/swift-test.stderr.log" >&2
          test "${statuses[0]}" -eq 0
          test "${statuses[1]}" -eq 0
          python3 tools/ci/collect-classified-bench.py research/live-mesh-classified-bench-20261028/Tests/LiveMeshBenchIngressTests.swift "$out"
          diff -u "$out/source-before.txt" "$out/source-after.txt"
      - name: Preserve classified-mesh synthetic test results
        if: always() && env.BLIND_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: classified-mesh-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/classified-mesh-bench/*.txt
            ${{ runner.temp }}/classified-mesh-bench/*.json
            ${{ runner.temp }}/classified-mesh-bench/*.xml
            ${{ runner.temp }}/classified-mesh-bench/*.log
          if-no-files-found: error
          retention-days: 3
      - name: Emit bounded log-only CI receipts
        if: always()
        timeout-minutes: 1
        env:
          CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: python3 -B tools/ci/emit-ci-log-receipts.py classified-mesh-bench
