name: Native strict endpoint contrast

on:
  push:
    branches: [master, codex/recovery-hazard-order-20261027]
    paths:
      - '.github/workflows/native-strict-endpoint-probe.yml'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/run.py'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/main.swift'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/strict_probe.h'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/association_appendix.cpp'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/cabi_tests.cpp'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/SOURCE_PINS.json'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/INPUT_PINS.json'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/PACKED_ROUTING_GEOMETRY.json'
      - 'research/native-floor-import-repair-20261028/strict-endpoint-probe/REQUESTS_49A.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-strict-endpoint-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'mischa23v/blind' && github.event.repository.private == false && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/recovery-hazard-order-20261027')
    runs-on: xcode-27
    timeout-minutes: 7
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Compile and run fixed legacy and opt-in strict policies
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          python3 research/native-floor-import-repair-20261028/strict-endpoint-probe/run.py
      - name: Preserve bounded evidence only, never build products
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-strict-endpoint-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/blind-strict-endpoint-probe/*.json
            ${{ runner.temp }}/blind-strict-endpoint-probe/*.txt
          if-no-files-found: error
          retention-days: 3
