name: Isolated hosted native QoS comparison
on:
  push:
    branches: [codex/recovery-hazard-order-20261027]
    paths:
      - '.github/workflows/native-qos-comparison.yml'
      - 'research/native-qos-comparison-20261030/**'
      - 'ios/BlindAssistTests/NativeQoSComparisonTests.swift'
      - 'tools/ci/native-qos-comparison.py'
      - 'tools/ci/test_native_qos_comparison.py'
permissions:
  contents: read
# Source publication after root review is the explicit execution point.
# No artifact upload action, cache, service, runner installation or runtime download.
env:
  BLIND_UPLOAD_ARTIFACTS: 'false'
concurrency:
  group: isolated-native-qos-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comparison:
    if: github.repository == 'mischa23v/blind' && github.event.repository.private == false && github.ref == 'refs/heads/codex/recovery-hazard-order-20261027'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Verify unchanged default project and installed Apple simulator
        id: preflight
        timeout-minutes: 3
        run: |
          python3 -B research/native-candidate-app-integration-85/integrated/check.py
          bash tools/ci/native-apple.sh preflight
      - name: Build isolated flagged hosted test only
        id: build
        timeout-minutes: 17
        run: python3 -B tools/ci/native-qos-comparison.py build
      - name: Execute one fixed ABBA diagnostic without rebuilding
        id: test
        timeout-minutes: 9
        run: python3 -B tools/ci/native-qos-comparison.py test
      - name: Preserve bounded failures and exact test identity in normal logs
        if: always()
        timeout-minutes: 1
        run: python3 -B tools/ci/native-qos-comparison.py collect
