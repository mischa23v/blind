name: Indoor IO buffered diagnostic (two predeclared one-shot arms)
on:
  push:
    branches: [codex/recovery-hazard-order-20261027]
    paths:
      - research/indoor-io-buffered-diagnostic/**
      - .github/workflows/indoor-io-buffered-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indoor-io-buffered-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'mischa23v/blind' && github.event.repository.private == false && github.ref == 'refs/heads/codex/recovery-hazard-order-20261027'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [utility, userInitiated]
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Check out reviewed diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Check out exact candidate into disposable source directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e9e18d15fe1fdac1ff1487b3c2a8a2e731607427
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Instrument phases and run original focused test once
        timeout-minutes: 26
        run: python3 harness/research/indoor-io-buffered-diagnostic/run.py source e9e18d15fe1fdac1ff1487b3c2a8a2e731607427 review ${{ matrix.arm }}
      - name: Preserve bounded public synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indoor-io-buffered-diagnostic-${{ matrix.arm }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/indoor-io-buffered-diagnostic-${{ matrix.arm }}/evidence/
          if-no-files-found: warn
          retention-days: 3
