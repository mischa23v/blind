name: Actual native search-clue speech callback probe
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/native-search-clue-speech.yml'
      - 'tests/scenarios/integrated/search-clue-speech/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-search-clue-speech-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workflows:
    if: github.repository == 'mischa23v/blind' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cc3b5f77f98e40735bfafee949c5a118110bd0c5
          path: workflow-baseline
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Prepare isolated host and require actual native speech callbacks
        run: bash tests/scenarios/integrated/search-clue-speech/run-accessible.sh "$GITHUB_WORKSPACE/workflow-baseline"
      - name: Preserve authored failure evidence (never device data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-search-clue-speech-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/blind-search-clue-native/*.log
            ${{ runner.temp }}/blind-search-clue-native/*.txt
            ${{ runner.temp }}/blind-search-clue-native/*.json
            ${{ runner.temp }}/blind-search-clue-native/accessible.xcresult
            ${{ runner.temp }}/blind-search-clue-native/attachments
            ${{ runner.temp }}/blind-search-clue-native/host/accessible-projection.json
            ${{ runner.temp }}/blind-search-clue-native/host/workflow-projection.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve small receipt-only evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-clue-receipts-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/blind-search-clue-native/summary.json
            ${{ runner.temp }}/blind-search-clue-native/attachments/*.json
          if-no-files-found: warn
          retention-days: 7
