name: Candidate local packages and default-off app compile
on:
  push:
    branches: [codex/recovery-hazard-order-20261027]
    paths:
      - 'research/native-candidate-app-integration-85/**'
      - 'research/native-mesh-decoder-81/**'
      - 'research/arkit-mesh-adapter-82/**'
      - 'research/mesh-candidate-ingress-83/**'
      - 'research/room-mesh-package-75/**'
      - '.github/workflows/native-candidate-app-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-native-app-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-only:
    if: github.repository == 'mischa23v/blind' && github.event.repository.private == false && github.ref == 'refs/heads/codex/recovery-hazard-order-20261027'
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Build actual local graph and compile proposal with flag absent and present
        timeout-minutes: 38
        run: python3 research/native-candidate-app-integration-85/apple/ci.py --app-proposal
      - name: Preserve bounded source-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-native-app-integration-85-receipts
          path: |
            ${{ runner.temp }}/blind-native-app-integration-85/*-receipt.json
            ${{ runner.temp }}/blind-native-app-integration-85/*-diagnostic.json
            ${{ runner.temp }}/blind-native-app-integration-85/RESULT.json
          if-no-files-found: warn
          retention-days: 3
